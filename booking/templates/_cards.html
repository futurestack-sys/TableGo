{% load static %}<div class="cards">{% for r in restaurants %}<article class="rcard"><div class="ph" style="background-image:url('{% static 'booking/img/'|add:r.slug|add:'.jpg' %}')"></div><div class="rb"><h3>{{ r.name }}</h3><p class="mu">📍 {{ r.location|default:"Main Branch" }}</p><p class="mu">🍴 {{ r.cuisine }}</p><a class="rbtn {{ r.slug }}" href="{% url 'restaurant' r.slug %}">Reserve Here →</a></div></article>{% endfor %}</div>
