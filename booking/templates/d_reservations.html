{% extends "dash_base.html" %}{% block heading %}<h1>Reservation Management</h1><p>Confirm or decline customer reservations</p>{% endblock %}
{% block body %}<form method="get" class="grid2" style="max-width:520px"><label>Status<select name="status" onchange="this.form.submit()"><option value="">All</option><option value="pending" {% if status == "pending" %}selected{% endif %}>Pending</option><option value="confirmed" {% if status == "confirmed" %}selected{% endif %}>Confirmed</option><option value="declined" {% if status == "declined" %}selected{% endif %}>Declined</option><option value="cancelled" {% if status == "cancelled" %}selected{% endif %}>Cancelled</option></select></label>
<label>Restaurant<select name="r" onchange="this.form.submit()"><option value="">All</option>{% for r in rests %}<option value="{{ r.slug }}" {% if r.slug == slug %}selected{% endif %}>{{ r.name }}</option>{% endfor %}</select></label></form>
<section class="box">{% include "_rtable.html" %}</section>{% endblock %}
